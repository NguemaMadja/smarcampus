<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Estudiantes - SmartCampusGuide</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css">
</head>
<body>

<div class="d-flex justify-content-between mb-4">
  <a href="admin.html" class="btn btn-outline-secondary">⬅️ Volver al Panel Principal</a>
  <a href="edificios.html" class="btn btn-primary">Ir al Módulo Edificios ➡️</a>
</div>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark" style="background-color: rgba(0, 64, 128, 0.85);">
  <div class="container-fluid">
    <a class="navbar-brand fw-bold" href="admin.html">SmartCampusGuide</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="menuPrincipal">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item"><a class="nav-link" href="usuarios.html">Usuarios</a></li>
        <li class="nav-item"><a class="nav-link" href="profesores.html">Profesores</a></li>
        <li class="nav-item"><a class="nav-link active" href="estudiantes.html">Estudiantes</a></li>
        <li class="nav-item"><a class="nav-link" href="edificios.html">Edificios</a></li>
        <li class="nav-item"><a class="nav-link" href="alertas.html">Alertas</a></li>
      </ul>
    </div>
  </div>
</nav>

<div class="container mt-4">
  <h2>Gestión de Estudiantes</h2>
  <button class="btn btn-success mb-3" data-bs-toggle="modal" data-bs-target="#modalEstudiante">➕ Nuevo Estudiante</button>

  <table id="tablaEstudiantes" class="display table table-striped" style="width:100%">
    <thead>
      <tr>
        <th>ID</th>
        <th>Nombre</th>
        <th>Correo</th>
        <th>Matrícula</th>
        <th>Acciones</th>
      </tr>
    </thead>
    <tbody>
      <!-- Se llenará dinámicamente -->
    </tbody>
  </table>
</div>

<!-- Modal para crear/editar estudiante -->
<div class="modal fade" id="modalEstudiante" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <form id="formEstudiante">
        <div class="modal-header">
          <h5 class="modal-title">Estudiante</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <input type="hidden" id="estudianteId">

          <div class="mb-3">
            <label for="estudianteUsuario" class="form-label">ID Usuario</label>
            <input type="number" class="form-control" id="estudianteUsuario" required>
          </div>

          <div class="mb-3">
            <label for="estudianteMatricula" class="form-label">Matrícula</label>
            <input type="text" class="form-control" id="estudianteMatricula" required>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button type="submit" class="btn btn-primary">Guardar</button>
        </div>
      </form>
    </div>
  </div>
</div>

<!-- Scripts -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
  let tabla;

  // Inicializar DataTable con AJAX
  tabla = $('#tablaEstudiantes').DataTable({
    ajax: {
      url: "/estudiantes",
      dataSrc: "data"
    },
    columns: [
      { data: 'id' },
      { data: 'nombre' },
      { data: 'correo' },
      { data: 'matricula' },
      {
        data: null,
        render: function (row) {
          return `
            <button class="btn btn-sm btn-primary btnEditar" data-id="${row.id}">✏️ Editar</button>
            <button class="btn btn-sm btn-danger btnEliminar" data-id="${row.id}">🗑️ Eliminar</button>
          `;
        }
      }
    ]
  });

  // Guardar estudiante (crear/editar)
  document.getElementById("formEstudiante").addEventListener("submit", function(e) {
    e.preventDefault();
    const id = document.getElementById("estudianteId").value;
    const estudiante = {
      id_usuario: document.getElementById("estudianteUsuario").value,
      matricula: document.getElementById("estudianteMatricula").value
    };

    const url = id ? `/estudiantes/${id}` : "/estudiantes";
    const method = id ? "PUT" : "POST";

    fetch(url, {
      method: method,
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(estudiante)
    })
    .then(res => res.json())
    .then(() => {
      tabla.ajax.reload();
      document.getElementById("formEstudiante").reset();
      document.getElementById("estudianteId").value = "";
      bootstrap.Modal.getInstance(document.getElementById("modalEstudiante")).hide();
    });
  });

  // Editar estudiante
  $(document).on("click", ".btnEditar", function() {
    const id = $(this).data("id");
    fetch(`/estudiantes/${id}`)
      .then(res => res.json())
      .then(estudiante => {
        document.getElementById("estudianteId").value = estudiante.data.id;
        document.getElementById("estudianteUsuario").value = estudiante.data.id_usuario;
        document.getElementById("estudianteMatricula").value = estudiante.data.matricula;
        new bootstrap.Modal(document.getElementById("modalEstudiante")).show();
      });
  });

  // Eliminar estudiante
  $(document).on("click", ".btnEliminar", function() {
    const id = $(this).data("id");
    if (confirm("¿Seguro que deseas eliminar este estudiante?")) {
      fetch(`/estudiantes/${id}`, { method: "DELETE" })
        .then(() => tabla.ajax.reload());
    }
  });
</script>

</body>
</html>
