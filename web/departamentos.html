      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <!-- Submenú de Usuarios -->
        <li class="nav-item dropdown">

            Usuarios

      </ul>

</nav>
<div class="container mt-4">
  <div class="d-flex justify-content-between align-items-center flex-wrap mb-3">
    <h2 class="mb-2 mb-md-0"><i class="bi bi-diagram-3 me-2"></i> Gestión de Departamentos</h2>
    <button class="btn btn-success" data-bs-toggle="modal" data-bs-target="#modalDepartamento">
      <i class="bi bi-plus-circle me-1"></i> Nuevo Departamento
    </button>
  </div>

  <div class="table-responsive">
    <table id="tablaDepartamentos" class="display table table-striped table-hover align-middle" style="width:100%">
      <thead class="table-dark">
        <tr>
          <th>ID</th>
          <th>Nombre</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody>
        <!-- Se llenará dinámicamente -->
      </tbody>
    </table>
  </div>
</div>

<!-- Modal para crear/editar departamento -->
<div class="modal fade" id="modalDepartamento" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered modal-lg">
    <div class="modal-content shadow-lg">
      <form id="formDepartamento">
        <div class="modal-header bg-primary text-white">
          <h5 class="modal-title"><i class="bi bi-building-add me-2"></i> Departamento</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <input type="hidden" id="departamentoId">
          <div class="mb-3">
            <label for="departamentoNombre" class="form-label">Nombre</label>
            <input type="text" class="form-control" id="departamentoNombre" required>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal"><i class="bi bi-x-circle me-1"></i> Cancelar</button>
          <button type="submit" class="btn btn-primary"><i class="bi bi-save me-1"></i> Guardar</button>
        </div>
      </form>
    </div>
  </div>
</div>
<!-- Scripts -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
  let tabla;

  function cargarDepartamentos() {
    fetch("/departamentos")
      .then(res => res.json())
      .then(data => {
        if (tabla) {
          tabla.clear().rows.add(data).draw();
        } else {
          tabla = $('#tablaDepartamentos').DataTable({
            data: data,
            columns: [
              { data: 'id_departamento' },
              { data: 'nombre' },
              {
                data: null,
                render: row => `
                  <button class="btn btn-sm btn-primary btnEditar me-1" data-id="${row.id_departamento}">
                    <i class="bi bi-pencil-square"></i>
                  </button>
                  <button class="btn btn-sm btn-danger btnEliminar" data-id="${row.id_departamento}">
                    <i class="bi bi-trash"></i>
                  </button>
                `
              }
            ],
            destroy: true,
            responsive: true, // 👈 activamos responsive
            columnDefs: [
              { targets: -1, orderable: false, searchable: false, className: 'all' } // 👈 columna de acciones siempre visible
            ],
            language: {
              url: '//cdn.datatables.net/plug-ins/1.13.6/i18n/es-ES.json'
            }
          });
        }
      })
      .catch(err => console.error("Error cargando departamentos:", err));
  }

  // Guardar departamento
  document.getElementById("formDepartamento").addEventListener("submit", e => {
    e.preventDefault();
    const id = document.getElementById("departamentoId").value;
    const nombre = document.getElementById("departamentoNombre").value;

    const url = id ? `/departamentos/${id}` : "/departamentos";
    const method = id ? "PUT" : "POST";

    fetch(url, {
      method,
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ nombre })
    })
    .then(res => res.json())
    .then(() => {
      cargarDepartamentos();
      document.getElementById("formDepartamento").reset();
      document.getElementById("departamentoId").value = "";
      bootstrap.Modal.getInstance(document.getElementById("modalDepartamento")).hide();
    })
    .catch(err => alert("Error guardando departamento: " + err.message));
  });

  // Editar departamento
  $(document).on("click", ".btnEditar", function() {
    const id = $(this).data("id");
    fetch(`/departamentos/${id}`)
      .then(res => res.json())
      .then(dep => {
        document.getElementById("departamentoId").value = dep.id_departamento;
        document.getElementById("departamentoNombre").value = dep.nombre;
        new bootstrap.Modal(document.getElementById("modalDepartamento")).show();
      })
      .catch(err => alert("Error cargando departamento: " + err.message));
  });

  // Eliminar departamento
  $(document).on("click", ".btnEliminar", function() {
    const id = $(this).data("id");
    if (confirm("¿Seguro que deseas eliminar este departamento?")) {
      fetch(`/departamentos/${id}`, { method: "DELETE" })
        .then(res => res.json())
        .then(() => cargarDepartamentos())
        .catch(err => alert("Error eliminando departamento: " + err.message));
    }
  });

  // Cargar al inicio
  cargarDepartamentos();
</script>

</body>
</html>
