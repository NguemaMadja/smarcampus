<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Panel Profesor - SmartCampusGuide</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #f5f5f5;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    header {
      background-color: rgba(0, 64, 128, 0.85);
      color: white;
      text-align: center;
      padding: 15px;
      font-size: 1.5rem;
      font-weight: bold;
    }
    .card {
      margin-top: 20px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.3);
      border-radius: 10px;
    }
    .card-header {
      font-weight: bold;
      background-color: rgba(0, 64, 128, 0.85);
      color: white;
    }
    footer {
      background-color: rgba(0, 64, 128, 0.85);
      color: white;
      text-align: center;
      padding: 10px;
      margin-top: auto;
    }
  </style>
</head>
<body>

  <!-- Cabecera -->
  <header>
    Panel del Profesor - SmartCampusGuide
  </header>

  <div class="container">
    <!-- Asignaturas -->
    <div class="card">
      <div class="card-header">Asignaturas</div>
      <div class="card-body">
        <button class="btn btn-primary" onclick="cargarAsignaturas()">Ver asignaturas</button>
        <ul id="listaAsignaturas" class="mt-3"></ul>
      </div>
    </div>

    <!-- Asistencia -->
    <div class="card">
      <div class="card-header">Asistencia</div>
      <div class="card-body">
        <button class="btn btn-success" onclick="cargarAsistencia()">Ver asistencia</button>
        <ul id="listaAsistencia" class="mt-3"></ul>
      </div>
    </div>

    <!-- Materiales -->
    <div class="card">
      <div class="card-header">Materiales</div>
      <div class="card-body">
        <button class="btn btn-info" onclick="cargarMateriales()">Ver materiales</button>
        <ul id="listaMateriales" class="mt-3"></ul>
      </div>
    </div>

    <!-- Estudiantes -->
    <div class="card">
      <div class="card-header">Estudiantes</div>
      <div class="card-body">
        <button class="btn btn-warning" onclick="cargarEstudiantes()">Ver estudiantes</button>
        <ul id="listaEstudiantes" class="mt-3"></ul>
      </div>
    </div>
  </div>

  <!-- Pie de página -->
  <footer>
    TODOS LOS DERECHOS RESERVADOS -UNGE- @ IoT A NUESTRO ALCANCE - 2026
  </footer>

  <!-- Scripts -->
  <script>
    async function cargarAsignaturas() {
      try {
        const res = await fetch("http://10.70.200.112:4000/asignaturas");
        const data = await res.json();
        const lista = document.getElementById("listaAsignaturas");
        lista.innerHTML = "";
        data.forEach(a => {
          const li = document.createElement("li");
          li.textContent = `${a.id_asignatura} - ${a.nombre} (${a.carrera})`;
          lista.appendChild(li);
        });
      } catch {
        alert("Error al cargar asignaturas");
      }
    }

    async function cargarAsistencia() {
      try {
        const res = await fetch("http://10.70.200.112:4000/asistencia");
        const data = await res.json();
        const lista = document.getElementById("listaAsistencia");
        lista.innerHTML = "";
        data.forEach(as => {
          const li = document.createElement("li");
          li.textContent = `Clase ${as.id_clase} - Estudiante ${as.id_estudiante} (${as.estado})`;
          lista.appendChild(li);
        });
      } catch {
        alert("Error al cargar asistencia");
      }
    }

    async function cargarMateriales() {
      try {
        const res = await fetch("http://10.70.200.112:4000/materiales");
        const data = await res.json();
        const lista = document.getElementById("listaMateriales");
        lista.innerHTML = "";
        data.forEach(m => {
          const li = document.createElement("li");
          li.textContent = `${m.id_material} - ${m.nombre} (${m.tipo})`;
          lista.appendChild(li);
        });
      } catch {
        alert("Error al cargar materiales");
      }
    }

    async function cargarEstudiantes() {
      try {
        const res = await fetch("http://10.70.200.112:4000/estudiantes");
        const data = await res.json();
        const lista = document.getElementById("listaEstudiantes");
        lista.innerHTML = "";
        data.forEach(e => {
          const li = document.createElement("li");
          li.textContent = `${e.id_estudiante} - ${e.nombre} (${e.carrera})`;
          lista.appendChild(li);
        });
      } catch {
        alert("Error al cargar estudiantes");
      }
    }
  </script>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
