<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Profesores - SmartCampusPLXIV</title>
  <meta name="viewport" content="width=device-width, initial-scale=1"> <!-- 👈 Responsive -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>
<body>

<div class="d-flex justify-content-between flex-wrap mb-4">
  <a href="admin.html" class="btn btn-outline-secondary mb-2 mb-md-0">⬅️ Volver al Panel Principal</a>
  <a href="estudiantes.html" class="btn btn-primary">Ir al Módulo Estudiantes ➡️</a>
</div>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark shadow-sm" style="background-color: rgba(0, 64, 128, 0.85);">
  <div class="container-fluid">
    <a class="navbar-brand fw-bold" href="admin.html"><i class="bi bi-person-badge-fill me-2"></i> SmartCampusGuide-PLXIV</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="menuPrincipal">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item"><a class="nav-link" href="usuarios.html">Usuarios</a></li>
        <li class="nav-item"><a class="nav-link active" href="profesores.html">Profesores</a></li>
        <li class="nav-item"><a class="nav-link" href="estudiantes.html">Estudiantes</a></li>
        <li class="nav-item"><a class="nav-link" href="edificios.html">Edificios</a></li>
        <li class="nav-item"><a class="nav-link" href="alertas.html">Alertas</a></li>
      </ul>
    </div>
  </div>
</nav>
<div class="container mt-4">
  <div class="d-flex justify-content-between align-items-center flex-wrap mb-3">
    <h2 class="mb-2 mb-md-0"><i class="bi bi-person-badge-fill me-2"></i> Gestión de Profesores</h2>
    <button class="btn btn-success" data-bs-toggle="modal" data-bs-target="#modalProfesor">
      <i class="bi bi-person-plus me-1"></i> Nuevo Profesor
    </button>
  </div>

  <div class="table-responsive">
    <table id="tablaProfesores" class="display table table-striped table-hover align-middle" style="width:100%">
      <thead class="table-dark">
        <tr>
          <th>ID</th>
          <th>Nombre</th>
          <th>Correo</th>
          <th>Departamento</th>
          <th>Carrera</th>
          <th>Asignaturas</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>
</div>

<!-- Modal -->
<div class="modal fade" id="modalProfesor" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered modal-lg">
    <div class="modal-content shadow-lg">
      <form id="formProfesor">
        <div class="modal-header bg-primary text-white">
          <h5 class="modal-title"><i class="bi bi-person-lines-fill me-2"></i> Profesor</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <input type="hidden" id="profesorId">

          <div class="mb-3">
            <label for="profesorUsuario" class="form-label">Usuario</label>
            <select id="profesorUsuario" class="form-select" required></select>
          </div>

          <div class="mb-3">
            <label for="profesorDepartamento" class="form-label">Departamentos</label>
            <select id="profesorDepartamento" class="form-select" multiple required></select>
          </div>

          <div class="mb-3">
            <label for="profesorCarrera" class="form-label">Carreras</label>
            <select id="profesorCarrera" class="form-select" multiple required></select>
          </div>

          <div class="mb-3">
            <label for="profesorAsignaturas" class="form-label">Asignaturas</label>
            <select id="profesorAsignaturas" class="form-select" multiple required></select>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal"><i class="bi bi-x-circle me-1"></i> Cancelar</button>
          <button type="submit" class="btn btn-primary"><i class="bi bi-save me-1"></i> Guardar</button>
        </div>
      </form>
    </div>
  </div>
</div>
<!-- Scripts -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
  let tabla;

  // Cargar asignaturas en el select
  function cargarAsignaturas(callback) {
    fetch("https://smarcampus.onrender.com/asignaturas")
      .then(res => res.json())
      .then(asigs => {
        const select = document.getElementById("profesorAsignaturas");
        select.innerHTML = "";
        asigs.forEach(a => {
          const option = document.createElement("option");
          option.value = a.id_asignatura;
          option.textContent = a.nombre;
          select.appendChild(option);
        });
        if (callback) callback();
      })
      .catch(err => console.error("Error cargando asignaturas:", err));
  }

  // Inicializar DataTable con responsive
  function cargarProfesores() {
    if (tabla) {
      tabla.ajax.reload();
    } else {
      tabla = $('#tablaProfesores').DataTable({
        ajax: {
          url: "https://smarcampus.onrender.com/profesores",
          dataSrc: ""
        },
        columns: [
          { data: 'id' },
          { data: 'nombre' },
          { data: 'correo' },
          { data: 'departamentos' },
          { data: 'carreras' },
          { data: 'asignaturas' },
          {
            data: null,
            render: function (row) {
              return `
                <button class="btn btn-sm btn-primary btnEditar me-1" data-id="${row.id}">
                  <i class="bi bi-pencil-square"></i>
                </button>
                <button class="btn btn-sm btn-danger btnEliminar" data-id="${row.id}">
                  <i class="bi bi-trash"></i>
                </button>
              `;
            }
          }
        ],
        responsive: true, // 👈 activamos responsive
        columnDefs: [
          { targets: -1, orderable: false, searchable: false, className: 'all' } // 👈 columna de acciones siempre visible
        ],
        language: { url: '//cdn.datatables.net/plug-ins/1.13.6/i18n/es-ES.json' }
      });
    }
  }

  cargarProfesores();

  // Abrir modal para nuevo profesor
  document.querySelector('[data-bs-target="#modalProfesor"]').addEventListener("click", () => {
    document.getElementById("formProfesor").reset();
    document.getElementById("profesorId").value = "";
    cargarUsuarios();
    cargarDepartamentos();
    cargarCarreras();
    cargarAsignaturas();
  });

  // Guardar profesor
  document.getElementById("formProfesor").addEventListener("submit", function(e) {
    e.preventDefault();
    const id = document.getElementById("profesorId").value;

    const departamentos_ids = Array.from(document.querySelectorAll('#profesorDepartamento option:checked')).map(opt => parseInt(opt.value));
    const carreras_ids = Array.from(document.querySelectorAll('#profesorCarrera option:checked')).map(opt => parseInt(opt.value));
    const asignaturas_ids = Array.from(document.querySelectorAll('#profesorAsignaturas option:checked')).map(opt => parseInt(opt.value));

    const profesor = {
      id_usuario: document.getElementById("profesorUsuario").value,
      departamentos_ids,
      carreras_ids,
      asignaturas_ids
    };

    const url = id ? `https://smarcampus.onrender.com/profesores/${id}` : "https://smarcampus.onrender.com/profesores";
    const method = id ? "PUT" : "POST";

    fetch(url, {
      method: method,
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(profesor)
    })
    .then(res => {
      if (!res.ok) throw new Error("Error guardando profesor");
      return res.json();
    })
    .then(() => {
      cargarProfesores();
      document.getElementById("formProfesor").reset();
      document.getElementById("profesorId").value = "";
      bootstrap.Modal.getInstance(document.getElementById("modalProfesor")).hide();
    })
    .catch(err => console.error("Error:", err));
  });

  // Editar profesor
  $(document).on("click", ".btnEditar", function() {
    const id = $(this).data("id");
    fetch(`https://smarcampus.onrender.com/profesores/${id}`)
      .then(res => res.json())
      .then(p => {
        document.getElementById("profesorId").value = p.id;
        cargarUsuarios();
        cargarDepartamentos(() => {
          document.querySelectorAll('#profesorDepartamento option').forEach(opt => {
            opt.selected = p.departamentos_ids?.includes(parseInt(opt.value)) || false;
          });
        });
        cargarCarreras(() => {
          document.querySelectorAll('#profesorCarrera option').forEach(opt => {
            opt.selected = p.carreras_ids?.includes(parseInt(opt.value)) || false;
          });
        });
        cargarAsignaturas(() => {
          document.querySelectorAll('#profesorAsignaturas option').forEach(opt => {
            opt.selected = p.asignaturas_ids?.includes(parseInt(opt.value)) || false;
          });
        });
        new bootstrap.Modal(document.getElementById("modalProfesor")).show();
      })
      .catch(err => console.error("Error cargando profesor:", err));
  });

  // Eliminar profesor
  $(document).on("click", ".btnEliminar", function() {
    const id = $(this).data("id");
    if (confirm("¿Seguro que quieres eliminar este profesor?")) {
      fetch(`https://smarcampus.onrender.com/profesores/${id}`, { method: "DELETE" })
        .then(res => {
          if (!res.ok) throw new Error("Error eliminando profesor");
          return res.json();
        })
        .then(() => {
          cargarProfesores();
        })
        .catch(err => console.error("Error eliminando profesor:", err));
    }
  });
</script>

</body>
</html>
