<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Profesores - SmartCampusPLXIV</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css">
</head>
<body>

<div class="d-flex justify-content-between mb-4">
  <a href="admin.html" class="btn btn-outline-secondary">⬅️ Volver al Panel Principal</a>
  <a href="estudiantes.html" class="btn btn-primary">Ir al Módulo Estudiantes ➡️</a>
</div>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark" style="background-color: rgba(0, 64, 128, 0.85);">
  <div class="container-fluid">
    <a class="navbar-brand fw-bold" href="admin.html">SmartCampusGuide-PLXIV</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="menuPrincipal">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item"><a class="nav-link" href="usuarios.html">Usuarios</a></li>
        <li class="nav-item"><a class="nav-link active" href="profesores.html">Profesores</a></li>
        <li class="nav-item"><a class="nav-link" href="estudiantes.html">Estudiantes</a></li>
        <li class="nav-item"><a class="nav-link" href="edificios.html">Edificios</a></li>
        <li class="nav-item"><a class="nav-link" href="alertas.html">Alertas</a></li>
      </ul>
    </div>
  </div>
</nav>

<div class="container mt-4">
  <h2>Gestión de Profesores</h2>
  <button class="btn btn-success mb-3" data-bs-toggle="modal" data-bs-target="#modalProfesor">➕ Nuevo Profesor</button>

  <table id="tablaProfesores" class="display table table-striped" style="width:100%">
    <thead>
      <tr>
        <th>ID</th>
        <th>Nombre</th>
        <th>Correo</th>
        <th>Departamento</th>
        <th>Carrera</th>
        <th>Asignaturas</th>
        <th>Acciones</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
</div>
<!-- Modal -->
<div class="modal fade" id="modalProfesor" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <form id="formProfesor">
        <div class="modal-header">
          <h5 class="modal-title">Profesor</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <input type="hidden" id="profesorId">

          <div class="mb-3">
            <label for="profesorUsuario" class="form-label">Usuario</label>
            <select id="profesorUsuario" class="form-select" required></select>
          </div>

          <div class="mb-3">
            <label for="profesorDepartamento" class="form-label">Departamentos</label>
            <input type="text" class="form-control" id="profesorDepartamento" required>
          </div>

          <div class="mb-3">
            <label for="profesorCarrera" class="form-label">Carreras</label>
            <input type="text" class="form-control" id="profesorCarrera" required>
          </div>

          <div class="mb-3">
            <label for="profesorAsignaturas" class="form-label">Asignaturas</label>
            <input type="text" class="form-control" id="profesorAsignaturas" required>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button type="submit" class="btn btn-primary">Guardar</button>
        </div>
      </form>
    </div>
  </div>
</div>
<!-- Scripts -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
  let tabla;

  // Cargar usuarios en el select
  function cargarUsuarios() {
    fetch("https://smarcampusguide.onrender.com/usuarios")
      .then(res => res.json())
      .then(usuarios => {
        const select = document.getElementById("profesorUsuario");
        select.innerHTML = "";
        usuarios.forEach(u => {
          const option = document.createElement("option");
          option.value = u.id_usuario;
          option.textContent = `${u.nombre} (${u.correo})`;
          select.appendChild(option);
        });
      })
      .catch(err => console.error("Error cargando usuarios:", err));
  }

  // Inicializar DataTable
  function cargarProfesores() {
    if (tabla) {
      tabla.ajax.reload();
    } else {
      tabla = $('#tablaProfesores').DataTable({
        ajax: {
          url: "https://smarcampus.onrender.com/profesores",
          dataSrc: ""
        },
        columns: [
          { data: 'id' },
          { data: 'nombre' },
          { data: 'correo' },
          { data: 'departamentos' },
          { data: 'carreras' },
          { data: 'asignaturas' },
          {
            data: null,
            render: function (row) {
              return `
                <button class="btn btn-sm btn-primary btnEditar" data-id="${row.id}">✏️ Editar</button>
                <button class="btn btn-sm btn-danger btnEliminar" data-id="${row.id}">🗑️ Eliminar</button>
              `;
            }
          }
        ]
      });
    }
  }

  cargarProfesores();

  // Abrir modal para nuevo profesor
  document.querySelector('[data-bs-target="#modalProfesor"]').addEventListener("click", () => {
    document.getElementById("formProfesor").reset();
    document.getElementById("profesorId").value = "";
    cargarUsuarios();
  });
  // Guardar profesor
  document.getElementById("formProfesor").addEventListener("submit", function(e) {
    e.preventDefault();
    const id = document.getElementById("profesorId").value;

    const profesor = {
      id_usuario: document.getElementById("profesorUsuario").value,
      departamentos: document.getElementById("profesorDepartamento").value,
      carreras: document.getElementById("profesorCarrera").value,
      asignaturas: document.getElementById("profesorAsignaturas").value
    };

    const url = id 
      ? `https://smarcampus.onrender.com/profesores/${id}` 
      : "https://smarcampus.onrender.com/profesores";
    const method = id ? "PUT" : "POST";

    fetch(url, {
      method: method,
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(profesor)
    })
    .then(res => {
      if (!res.ok) throw new Error("Error guardando profesor");
      return res.json();
    })
    .then(() => {
      cargarProfesores();
      document.getElementById("formProfesor").reset();
      document.getElementById("profesorId").value = "";
      bootstrap.Modal.getInstance(document.getElementById("modalProfesor")).hide();
    })
    .catch(err => console.error("Error:", err));
  });

  // Editar profesor
  $(document).on("click", ".btnEditar", function() {
    const id = $(this).data("id");
    fetch(`https://smarcampus.onrender.com/profesores/${id}`)
      .then(res => res.json())
      .then(p => {
        document.getElementById("profesorId").value = p.id;
        document.getElementById("profesorDepartamento").value = p.departamentos;
        document.getElementById("profesorCarrera").value = p.carreras;
        document.getElementById("profesorAsignaturas").value = p.asignaturas;

        cargarUsuarios();
        new bootstrap.Modal(document.getElementById("modalProfesor")).show();
      })
      .catch(err => console.error("Error cargando profesor:", err));
  });

  // Eliminar profesor
  $(document).on("click", ".btnEliminar", function() {
    const id = $(this).data("id");
    if (confirm("¿Seguro que quieres eliminar este profesor?")) {
      fetch(`https://smarcampus.onrender.com/profesores/${id}`, { method: "DELETE" })
        .then(res => {
          if (!res.ok) throw new Error("Error eliminando profesor");
          return res.json();
        })
        .then(() => {
          cargarProfesores();
        })
        .catch(err => console.error("Error eliminando profesor:", err));
    }
  });
</script>
</body>
</html>
