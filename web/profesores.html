<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Profesores - SmartCampusPLXIV</title>
  <meta name="viewport" content="width=device-width, initial-scale=1"> <!-- 👈 Responsive -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark shadow-sm" style="background-color: rgba(0, 64, 128, 0.85);">
  <div class="container-fluid">
    <a class="navbar-brand fw-bold" href="admin.html"><i class="bi bi-person-badge-fill me-2"></i> SmartCampusGuide</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="menuPrincipal">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item"><a class="nav-link" href="usuarios.html">Usuarios</a></li>
        <li class="nav-item"><a class="nav-link active" href="profesores.html">Profesores</a></li>
        <li class="nav-item"><a class="nav-link" href="estudiantes.html">Estudiantes</a></li>
        <li class="nav-item"><a class="nav-link" href="edificios.html">Edificios</a></li>
        <li class="nav-item"><a class="nav-link" href="alertas.html">Alertas</a></li>
      </ul>
      <a href="estudiantes.html" class="btn btn-outline-light ms-auto"><i class="bi bi-arrow-right-circle me-1"></i> Ir a Estudiantes</a>
    </div>
  </div>
</nav>
<div class="container mt-4">
  <div class="d-flex justify-content-between align-items-center flex-wrap mb-3">
    <h2 class="mb-2 mb-md-0"><i class="bi bi-person-badge-fill me-2"></i> Gestión de Profesores</h2>
    <button class="btn btn-success" data-bs-toggle="modal" data-bs-target="#modalProfesor">
      <i class="bi bi-person-plus me-1"></i> Nuevo Profesor
    </button>
  </div>

  <div class="table-responsive">
    <table id="tablaProfesores" class="display table table-striped table-hover align-middle" style="width:100%">
      <thead class="table-dark">
        <tr>
          <th>ID</th>
          <th>Nombre</th>
          <th>Correo</th>
          <th>Departamento</th>
          <th>Carrera</th>
          <th>Asignaturas</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>
</div>

<!-- Modal -->
<div class="modal fade" id="modalProfesor" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered modal-lg">
    <div class="modal-content shadow-lg">
      <form id="formProfesor">
        <div class="modal-header bg-primary text-white">
          <h5 class="modal-title"><i class="bi bi-person-lines-fill me-2"></i> Profesor</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <input type="hidden" id="profesorId">

          <div class="mb-3">
            <label for="profesorUsuario" class="form-label">Usuario</label>
            <select id="profesorUsuario" class="form-select" required></select>
          </div>

          <div class="mb-3">
            <label for="profesorDepartamento" class="form-label">Departamentos</label>
            <select id="profesorDepartamento" class="form-select" multiple required></select>
          </div>

          <div class="mb-3">
            <label for="profesorCarrera" class="form-label">Carreras</label>
            <select id="profesorCarrera" class="form-select" multiple required></select>
          </div>

          <div class="mb-3">
            <label for="profesorAsignaturas" class="form-label">Asignaturas</label>
            <select id="profesorAsignaturas" class="form-select" multiple required></select>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal"><i class="bi bi-x-circle me-1"></i> Cancelar</button>
          <button type="submit" class="btn btn-primary"><i class="bi bi-save me-1"></i> Guardar</button>
        </div>
      </form>
    </div>
  </div>
</div>
<!-- Scripts -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
  let tabla;

  // Cargar asignaturas en el select
  function cargarAsignaturas(callback) {
    fetch("https://smarcampus.onrender.com/asignaturas")
      .then(res => res.json())
      .then(asigs => {
        const select = document.getElementById("profesorAsignaturas");
        select.innerHTML = "";
        asigs.forEach(a => {
          const option = document.createElement("option");
          option.value = a.id_asignatura;
          option.textContent = a.nombre;
          select.appendChild(option);
        });
        if (callback) callback();
      })
      .catch(err => console.error("Error cargando asignaturas:", err));
  }

  // Inicializar DataTable con responsive
  function cargarProfesores() {
    if (tabla) {
      tabla.ajax.reload();
    } else {
      tabla = $('#tablaProfesores').DataTable({
        ajax: {
          url: "https://smarcampus.onrender.com/profesores",
          dataSrc: ""
        },
        columns: [
          { data: 'id' },
          { data: 'nombre' },
          { data: 'correo' },
          { data: 'departamentos' },
          { data: 'carreras' },
          { data: 'asignaturas' },
          {
            data: null,
            render: function (row) {
              return `
                <button class="btn btn-sm btn-primary btnEditar me-1" data-id="${row.id}"><i class="bi bi-pencil-square"></i></button>
                <button class="btn btn-sm btn-danger btnEliminar" data-id="${row.id}"><i class="bi bi-trash"></i></button>
              `;
            }
          }
        ],
        responsive: true, // 👈 añadido
        language: { url: '//cdn.datatables.net/plug-ins/1.13.6/i18n/es-ES.json' }
      });
    }
  }

  cargarProfesores();

  // Abrir modal para nuevo profesor
  document.querySelector('[data-bs-target="#modalProfesor"]').addEventListener("click", () => {
    document.getElementById("formProfesor").reset();
    document.getElementById("profesorId").value = "";
    cargarUsuarios();
    cargarDepartamentos();
    cargarCarreras();
    cargarAsignaturas();
  });

  // Guardar, Editar y Eliminar profesor (idéntico a tu código original)
  // ...
</script>

</body>
</html>
