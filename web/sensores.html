<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Sensores - SmartCampusGuide</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css">
  <link rel="stylesheet" href="https://cdn.datatables.net/buttons/2.4.1/css/buttons.dataTables.min.css">
  <style>
    body { min-height: 100vh; display: flex; flex-direction: column; }
    footer { margin-top: auto; }
    .modal-header { background-color: rgba(0, 64, 128, 0.85); color: white; }
    .btn-rounded { border-radius: 20px; }
    #graficoSensor { height: 400px; }
  </style>
</head>
<body>
<div class="container mt-4">
  <h2>Datos de Sensores</h2>
  <div class="mb-3">
    <button class="btn btn-success btn-rounded" data-bs-toggle="modal" data-bs-target="#modalAgregar">➕ Registrar Sensor</button>
    <button class="btn btn-info btn-rounded" data-bs-toggle="modal" data-bs-target="#modalTipos">⚙️ Gestionar Tipos de Sensores</button>
  </div>
  <table id="tablaSensores" class="display table table-striped table-bordered" style="width:100%">
    <thead class="table-dark">
      <tr>
        <th>ID Sensor</th>
        <th>Tipo</th>
        <th>Aula</th>
        <th>Ubicación</th>
        <th>Valor</th>
        <th>Fecha</th>
        <th>Hora</th>
        <th>Acciones</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
</div>
<!-- Modal Gráfico -->
<div class="modal fade" id="modalGrafico" tabindex="-1">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header"><h5 class="modal-title">Gráfico del Sensor</h5></div>
      <div class="modal-body">
        <canvas id="graficoSensor"></canvas>
      </div>
    </div>
  </div>
</div>
<footer class="text-center mt-4 p-3" style="background-color: rgba(0, 64, 128, 0.85); color: white;">
  TODOS LOS DERECHOS RESERVADOS -UNGE- @ IoT A NUESTRO ALCANCE - 2026
</footer>

<script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
<script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.datatables.net/buttons/2.4.1/js/dataTables.buttons.min.js"></script>
<script src="https://cdn.datatables.net/buttons/2.4.1/js/buttons.html5.min.js"></script>
<script src="https://cdn.datatables.net/buttons/2.4.1/js/buttons.print.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>
  $(document).ready(function() {
    const tablaSensores = $('#tablaSensores').DataTable({
      dom: 'Bfrtip',
      buttons: ['copy', 'csv', 'excel', 'pdf', 'print']
    });

    // Cargar sensores
    function cargarSensores(){
      fetch("/sensores")
        .then(res => res.json())
        .then(data => {
          tablaSensores.clear();
          data.forEach(s => {
            tablaSensores.row.add([
              s.id_sensor,
              s.tipo,
              s.aula,
              s.ubicacion,
              s.valor || "-",
              s.fecha || "-",
              s.hora || "-",
              `<button class="btn btn-primary btn-sm btnGrafico" data-id="${s.id_sensor}">📊</button>
               <button class="btn btn-warning btn-sm btnEditar" data-id="${s.id_sensor}">✏️</button>
               <button class="btn btn-danger btn-sm btnEliminar" data-id="${s.id_sensor}">🗑️</button>`
            ]);
          });
          tablaSensores.draw();
        });
    }

    cargarSensores();

    // Mostrar gráfico
    $('#tablaSensores').on('click','.btnGrafico', function(){
      const id = $(this).data('id');
      fetch(`/sensores/${id}/historial`)
        .then(res => res.json())
        .then(data => {
          const ctx = document.getElementById('graficoSensor').getContext('2d');
          new Chart(ctx, {
            type: 'line',
            data: {
              labels: data.map(d => d.fecha + " " + d.hora),
              datasets: [{
                label: 'Valores del Sensor',
                data: data.map(d => d.valor),
                borderColor: 'rgba(0,64,128,0.85)',
                fill: false
              }]
            }
          });
          $('#modalGrafico').modal('show');
        });
    });
  });
</script>
</body>
</html>
