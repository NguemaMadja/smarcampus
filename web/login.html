<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Login - SmartCampusGuide</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

  <style>
    body {
      background: linear-gradient(135deg, #004080, #0066cc);
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .login-card {
      width: 380px;
      border-radius: 12px;
      overflow: hidden;
    }
    .login-card h3 {
      font-weight: bold;
      color: #004080;
    }
    .btn-primary {
      background-color: #004080;
      border: none;
    }
    .btn-primary:hover {
      background-color: #003366;
    }
    .login-icon {
      font-size: 3rem;
      color: #004080;
    }
  </style>
</head>
<body>

  <div class="card p-4 shadow login-card bg-white">
    <div class="text-center mb-3">
      <i class="bi bi-person-circle login-icon"></i>
    </div>
    <h3 class="text-center mb-3">Iniciar Sesión</h3>
    <form id="formLogin">
      <div class="mb-3">
        <label for="usuario" class="form-label">Correo</label>
        <input type="email" class="form-control" id="usuario" required>
      </div>
      <div class="mb-3">
        <label for="password" class="form-label">Contraseña</label>
        <input type="password" class="form-control" id="password" required>
      </div>
      <button type="submit" class="btn btn-primary w-100">Entrar</button>
    </form>
  </div>

  <script>
    document.getElementById("formLogin").addEventListener("submit", async function(e){
      e.preventDefault();
      const correo = document.getElementById("usuario").value;
      const password = document.getElementById("password").value;

      try {
        const res = await fetch("/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ correo, password })
        });

        if(!res.ok){
          throw new Error("Credenciales incorrectas");
        }

        const data = await res.json();
        const rol = data.usuario.rol;

        // Guardar sesión en navegador
        sessionStorage.setItem("usuarioActivo", data.usuario.nombre);
        sessionStorage.setItem("rolActivo", rol);

        // Redirección según rol
        if(rol === "admin"){
          window.location.href = "admin.html";
        } else if(rol === "profesor"){
          window.location.href = "profesor.html";
        } else if(rol === "estudiante"){
          window.location.href = "estudiantes.html";
        } else {
          alert("Rol desconocido");
        }
      } catch(err){
        alert("Error al iniciar sesión: " + err.message);
      }
    });
  </script>
</body>
</html>
