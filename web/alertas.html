<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Alertas - SmartCampusGuide</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css">
</head>
<body>

<div class="d-flex justify-content-between mb-4">
  <a href="admin.html" class="btn btn-outline-secondary">⬅️ Volver al Panel Principal</a>
  <a href="asistencia.html" class="btn btn-primary">Ir al Módulo Asistencia Profesores ➡️</a>
</div>



  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark" style="background-color: rgba(0, 64, 128, 0.85);">
    <div class="container-fluid">
      <a class="navbar-brand fw-bold" href="admin.html">SmartCampusGuide</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="menuPrincipal">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item"><a class="nav-link" href="usuarios.html">Usuarios</a></li>
          <li class="nav-item"><a class="nav-link" href="profesores.html">Profesores</a></li>
          <li class="nav-item"><a class="nav-link" href="estudiantes.html">Estudiantes</a></li>
          <li class="nav-item"><a class="nav-link" href="edificios.html">Edificios</a></li>
          <li class="nav-item"><a class="nav-link active" href="alertas.html">Alertas</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="container mt-4">
    <h2>Gestión de Alertas</h2>
    <button class="btn btn-success mb-3" data-bs-toggle="modal" data-bs-target="#modalAlerta">➕ Nueva Alerta</button>

    <table id="tablaAlertas" class="display table table-striped" style="width:100%">
      <thead>
        <tr>
          <th>ID</th>
          <th>Título</th>
          <th>Descripción</th>
          <th>Prioridad</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody>
        <!-- Se llenará dinámicamente -->
      </tbody>
    </table>
  </div>
  <!-- Modal para crear/editar alerta -->
  <div class="modal fade" id="modalAlerta" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <form id="formAlerta">
          <div class="modal-header">
            <h5 class="modal-title">Alerta</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <input type="hidden" id="alertaId">

            <div class="mb-3">
              <label for="alertaTitulo" class="form-label">Título</label>
              <input type="text" class="form-control" id="alertaTitulo" required>
            </div>

            <div class="mb-3">
              <label for="alertaDescripcion" class="form-label">Descripción</label>
              <textarea class="form-control" id="alertaDescripcion" rows="3" required></textarea>
            </div>

            <div class="mb-3">
              <label for="alertaPrioridad" class="form-label">Prioridad</label>
              <select class="form-select" id="alertaPrioridad" required>
                <option value="alta">Alta</option>
                <option value="media">Media</option>
                <option value="baja">Baja</option>
              </select>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
            <button type="submit" class="btn btn-primary">Guardar</button>
          </div>
        </form>
      </div>
    </div>
  </div>
  <!-- Scripts -->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    let tabla;

    // Inicializar tabla
    function cargarAlertas() {
      fetch("http://10.70.200.112:4000/alertas")
        .then(res => res.json())
        .then(data => {
          if (tabla) {
            tabla.clear().rows.add(data).draw();
          } else {
            tabla = $('#tablaAlertas').DataTable({
              data: data,
              columns: [
                { data: 'id' },
                { data: 'titulo' },
                { data: 'descripcion' },
                { data: 'prioridad' },
                {
                  data: null,
                  render: function (row) {
                    return `
                      <button class="btn btn-sm btn-primary btnEditar" data-id="${row.id}">✏️ Editar</button>
                      <button class="btn btn-sm btn-danger btnEliminar" data-id="${row.id}">🗑️ Eliminar</button>
                    `;
                  }
                }
              ]
            });
          }
        });
    }

    // Guardar alerta (crear/editar)
    document.getElementById("formAlerta").addEventListener("submit", function(e) {
      e.preventDefault();
      const id = document.getElementById("alertaId").value;
      const alerta = {
        titulo: document.getElementById("alertaTitulo").value,
        descripcion: document.getElementById("alertaDescripcion").value,
        prioridad: document.getElementById("alertaPrioridad").value
      };

      const url = id ? `http://10.70.200.112:4000/alertas/${id}` : "http://10.70.200.112:4000/alertas";
      const method = id ? "PUT" : "POST";

      fetch(url, {
        method: method,
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(alerta)
      })
      .then(res => res.json())
      .then(() => {
        cargarAlertas();
        document.getElementById("formAlerta").reset();
        document.getElementById("alertaId").value = "";
        bootstrap.Modal.getInstance(document.getElementById("modalAlerta")).hide();
      });
    });

    // Editar alerta
    $(document).on("click", ".btnEditar", function() {
      const id = $(this).data("id");
      fetch(`http://10.70.200.112:4000/alertas/${id}`)
        .then(res => res.json())
        .then(alerta => {
          document.getElementById("alertaId").value = alerta.id;
          document.getElementById("alertaTitulo").value = alerta.titulo;
          document.getElementById("alertaDescripcion").value = alerta.descripcion;
          document.getElementById("alertaPrioridad").value = alerta.prioridad;
          new bootstrap.Modal(document.getElementById("modalAlerta")).show();
        });
    });

    // Eliminar alerta
    $(document).on("click", ".btnEliminar", function() {
      const id = $(this).data("id");
      if (confirm("¿Seguro que deseas eliminar esta alerta?")) {
        fetch(`http://10.70.200.112:4000/alertas/${id}`, { method: "DELETE" })
          .then(() => cargarAlertas());
      }
    });

    // Cargar alertas al inicio
    cargarAlertas();
  </script>
</body>
</html>
