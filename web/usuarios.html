<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Usuarios - SmartCampusGuide</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css">
</head>
<body>

<div class="d-flex justify-content-between mb-4">
  <a href="admin.html" class="btn btn-outline-secondary">⬅️ Volver al Panel Principal</a>
  <a href="profesores.html" class="btn btn-primary">Ir al Módulo Profesores ➡️</a>
</div>


  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark" style="background-color: rgba(0, 64, 128, 0.85);">
    <div class="container-fluid">
      <a class="navbar-brand fw-bold" href="admin.html">SmartCampusGuide</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="menuPrincipal">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item"><a class="nav-link active" href="usuarios.html">Usuarios</a></li>
          <li class="nav-item"><a class="nav-link" href="profesores.html">Profesores</a></li>
          <li class="nav-item"><a class="nav-link" href="estudiantes.html">Estudiantes</a></li>
          <li class="nav-item"><a class="nav-link" href="edificios.html">Edificios</a></li>
          <li class="nav-item"><a class="nav-link" href="alertas.html">Alertas</a></li>
        </ul>
      </div>
    </div>
  </nav>
  <div class="container mt-4">
    <h2>Gestión de Usuarios</h2>
    <button class="btn btn-success mb-3" data-bs-toggle="modal" data-bs-target="#modalUsuario">➕ Nuevo Usuario</button>

    <table id="tablaUsuarios" class="display table table-striped" style="width:100%">
      <thead>
        <tr>
          <th>ID</th>
          <th>Nombre</th>
          <th>Email</th>
          <th>Rol</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody>
        <!-- Se llenará dinámicamente -->
      </tbody>
    </table>
  </div>
  <!-- Modal para crear/editar usuario -->
  <div class="modal fade" id="modalUsuario" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <form id="formUsuario">
          <div class="modal-header">
            <h5 class="modal-title">Usuario</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <input type="hidden" id="usuarioId">
           <div class="mb-3">
              <label for="usuarioNombre" class="form-label">Nombre</label>
              <input type="text" class="form-control" id="usuarioNombre" required>
            </div>

            <div class="mb-3">
              <label for="usuarioEmail" class="form-label">Email</label>
              <input type="email" class="form-control" id="usuarioEmail" required>
            </div>

            <div class="mb-3">
              <label for="usuarioRol" class="form-label">Rol</label>
              <select class="form-select" id="usuarioRol" required>
                <option value="admin">Admin</option>
                <option value="profesor">Profesor</option>
                <option value="estudiante">Estudiante</option>
              </select>
            </div>

            <!-- Campo contraseña -->
            <div class="mb-3">
              <label for="usuarioPassword" class="form-label">Contraseña</label>
              <input type="password" class="form-control" id="usuarioPassword" required>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
            <button type="submit" class="btn btn-primary">Guardar</button>
          </div>
        </form>
      </div>
    </div>
  </div>
  <!-- Scripts -->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
  let tabla;

  function cargarUsuarios() {
    fetch("http://10.70.200.112:4000/usuarios")
      .then(res => res.json())
      .then(data => {
        console.log("Usuarios recibidos:", data);
        if (tabla) {
          tabla.clear().rows.add(data).draw();
        } else {
          tabla = $('#tablaUsuarios').DataTable({
            data: data,
            columns: [
              { data: 'id_usuario' },
              { data: 'nombre' },
              { data: 'correo' },
              { data: 'rol' },
              {
                data: null,
                render: function (row) {
                  return `
                    <button class="btn btn-sm btn-primary btnEditar" data-id="${row.id_usuario}">✏️ Editar</button>
                    <button class="btn btn-sm btn-danger btnEliminar" data-id="${row.id_usuario}">🗑️ Eliminar</button>
                  `;
                }
              }
            ],
            destroy: true,
            responsive: true,
            language: {
              url: '//cdn.datatables.net/plug-ins/1.13.6/i18n/es-ES.json'
            }
          });
        }
      })
      .catch(err => console.error("Error cargando usuarios:", err));
  }

  // Guardar usuario (crear/editar)
  document.getElementById("formUsuario").addEventListener("submit", function(e) {
    e.preventDefault();
    const id = document.getElementById("usuarioId").value;
    const usuario = {
      nombre: document.getElementById("usuarioNombre").value,
      correo: document.getElementById("usuarioEmail").value,
      rol: document.getElementById("usuarioRol").value,
      password: document.getElementById("usuarioPassword").value
    };

    const url = id ? `http://10.70.200.112:4000/usuarios/${id}` : "http://10.70.200.112:4000/usuarios";
    const method = id ? "PUT" : "POST";

    fetch(url, {
      method: method,
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(usuario)
    })
    .then(res => {
      if (!res.ok) throw new Error("Error al guardar usuario");
      return res.json();
    })
    .then(() => {
      cargarUsuarios();
      document.getElementById("formUsuario").reset();
      document.getElementById("usuarioId").value = "";
      bootstrap.Modal.getInstance(document.getElementById("modalUsuario")).hide();
    })
    .catch(err => alert("No se pudo guardar el usuario: " + err.message));
  });

  // Editar usuario
  $(document).on("click", ".btnEditar", function() {
    const id = $(this).data("id");
    fetch(`http://10.70.200.112:4000/usuarios/${id}`)
      .then(res => {
        if (!res.ok) throw new Error("Usuario no encontrado");
        return res.json();
      })
      .then(usuario => {
        document.getElementById("usuarioId").value = usuario.id_usuario;
        document.getElementById("usuarioNombre").value = usuario.nombre;
        document.getElementById("usuarioEmail").value = usuario.correo;
        document.getElementById("usuarioRol").value = usuario.rol;
        // No rellenamos contraseña al editar por seguridad
        new bootstrap.Modal(document.getElementById("modalUsuario")).show();
      })
      .catch(err => alert("Error al cargar usuario: " + err.message));
  });

  // Eliminar usuario
  $(document).on("click", ".btnEliminar", function() {
    const id = $(this).data("id");
    if (confirm("¿Seguro que deseas eliminar este usuario?")) {
      fetch(`http://10.70.200.112:4000/usuarios/${id}`, { method: "DELETE" })
        .then(res => {
          if (!res.ok) throw new Error("Error al eliminar usuario");
          cargarUsuarios();
        })
        .catch(err => alert("No se pudo eliminar el usuario: " + err.message));
    }
  });

  // Cargar usuarios al inicio
  cargarUsuarios();
</script>
</body>
</html>
